<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bar settings – Liquid Glass Navbar docs</title>
<link rel="stylesheet" href="{{APP_CSS}}">
<script type="module" src="{{APP_JS}}"></script>
</head>
<body>
<header class="dd-top">
  <a class="dd-brand" href="../">Liquid Glass Navbar <span class="dd-brand-docs">Docs</span></a>
  <nav class="dd-links" aria-label="Project">
    <a href="../">Docs</a>
    <a href="../../" class="dd-roomy">Builder</a>
    <a href="https://github.com/soheab-com/liquid-glass-navbar" class="dd-wide">GitHub</a>
    <button type="button" class="dd-theme" id="theme"></button>
  </nav>
</header>
<main class="ds-main">
  <h1>Bar settings</h1>
  <p class="dd-lede">Change how the docs’ own navigation looks and behaves. Every change applies to the bar on this page right away and is saved in this browser for the docs.</p>
  <form id="settings" class="ds-form" aria-describedby="settings-status"></form>
  <div class="ds-actions">
    <button type="button" id="settings-reset" class="dd-action">Restore defaults</button>
    <a href="../">Back to the docs</a>
    <output id="settings-status" class="ds-status" aria-live="polite"></output>
  </div>
</main>
</body>
</html>
